<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section" id="hold-panel">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
          <span class="hold-status">BLOQUEADO</span>
        </div>
      </aside>

      <canvas id="board"width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> guardar</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>

        <button id="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro">Tema</button>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div id="pause-main" class="overlay-box">
        <p id="pause-title" class="overlay-title">PAUSA</p>
        <button type="button" class="menu-btn" id="pause-resume">Reanudar</button>
        <button type="button" class="menu-btn" id="pause-restart">Reiniciar</button>
        <button type="button" class="menu-btn" id="pause-controls-btn">Controles</button>
        <div class="level-select" id="level-select">
          <span class="label">NIVEL INICIAL</span>
          <div class="level-row">
            <button type="button" class="level-btn" id="start-level-dec" aria-label="Disminuir nivel inicial">&minus;</button>
            <span id="start-level-value">1</span>
            <button type="button" class="level-btn" id="start-level-inc" aria-label="Aumentar nivel inicial">+</button>
          </div>
        </div>
      </div>
      <div id="pause-controls" class="overlay-box hidden">
        <p class="overlay-title">CONTROLES</p>
        <ul class="controls-list">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd><kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>C</kbd><kbd>Shift</kbd> guardar</li>
          <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          <li><kbd>T</kbd> tema</li>
        </ul>
        <button type="button" class="menu-btn" id="pause-back">Volver</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
