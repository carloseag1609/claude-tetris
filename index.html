<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section" id="hold-panel">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
          <span class="hold-status">BLOQUEADO</span>
        </div>
      </aside>

      <canvas id="board"width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> guardar</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>

        <button id="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro">Tema</button>
      </aside>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>
        <div class="scores-block">
          <span class="label">MEJORES PUNTUACIONES</span>
          <ol class="score-list" id="start-scores"></ol>
          <p class="records" id="start-records"></p>
        </div>
        <button id="start-btn" class="primary-btn">Jugar</button>
        <p class="hint">Enter para empezar</p>
        <button class="reset-scores link-btn" type="button">Borrar récords</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="new-record" class="hidden">¡Nuevo récord!</p>
        <form id="name-form" class="hidden" autocomplete="off">
          <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Tu nombre" />
          <button id="save-btn" type="submit">Guardar</button>
        </form>
        <div id="go-scores-block" class="scores-block hidden">
          <span class="label">MEJORES PUNTUACIONES</span>
          <ol class="score-list" id="go-scores"></ol>
          <p class="records" id="go-records"></p>
          <button class="reset-scores link-btn" type="button">Borrar récords</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
